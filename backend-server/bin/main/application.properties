# Server Configuration (Render dynamically passes PORT)
server.port=${PORT:8080}
server.address=0.0.0.0

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Use firebase on Render. Local is convenient for development and tests only.
app.storage.provider=${MEDIA_STORAGE_PROVIDER:local}
app.storage.base-path=${STORAGE_DIR:./data/uploads}

# AI and Firebase credentials must be provided by the environment.
gemini.api.key=${GEMINI_API_KEY:}
sarvam.api.key=${SARVAM_API_KEY:}
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:}
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# Management / Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.root=INFO
logging.level.com.kartavya.server=INFO
